  /v1/blog/moduleDetail:
    get:
      summary: Visible public moduleDetail
      parameters:
      - name: module_code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      module_detail:
                        $ref: '#/components/schemas/PublicModule'
                required:
                - code
                - msg
                - payload
        '404':
          $ref: '#/components/responses/Error'
        '500':
