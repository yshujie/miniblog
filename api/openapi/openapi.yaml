      properties:
        provider:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        metadata_status:
          type: string
          enum:
          - resolved
          - manual_required
        reason:
          type: string
        existing_article:
          $ref: '#/components/schemas/ArticleDTO'
      required:
      - provider
      - canonical_url
      - title
      - metadata_status
    RegisterInput:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        section_code:
          type: string
        subsection_code:
          type: string
        publish:
          type: boolean
          default: false
      required:
      - external_link
      - title
      - section_code
    RegisterPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - created
          - already_registered
        article:
          $ref: '#/components/schemas/ArticleDTO'
      required:
      - outcome
      - article
    Placement:
      type: object
      properties:
        section_code:
          type: string
        subsection_code:
          type: string
      required:
      - section_code
    ReorderArticles:
      type: object
      properties:
        section_code:
          type: string
        subsection_code:
          type: string
        article_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]{0,18}$
            description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
          uniqueItems: true
      required:
      - section_code
      - article_ids
    ReorderCatalog:
      type: object
      properties:
        kind:
          type: string
