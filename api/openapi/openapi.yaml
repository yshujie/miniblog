openapi: 3.0.3
info:
  title: miniblog content API
  version: 1.2.0
  description: Content endpoints in the existing /v1 contract. Authentication and
    other management APIs are unchanged. Registration requires MINIBLOG_CONTENT_REGISTER_ENABLED
    and completed source cutover. Archived state remains legacy wire Deleted. Nullable
    source identities are not accepted from clients.
paths:
  /v1/admin/article-sources/preview:
    post:
      summary: Best-effort title preview; provider failures still return manual_required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewInput'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    $ref: '#/components/schemas/PreviewPayload'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/register:
    post:
      summary: Atomic registration or publication; duplicates preserve existing record
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    $ref: '#/components/schemas/RegisterPayload'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/reorder:
    put:
      summary: Update one complete direct-section or subsection group
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderArticles'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/catalog/reorder:
    post:
      summary: Update one complete hierarchy group
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCatalog'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/move:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: move
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Placement'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/archive:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: archive
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: restore
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/publish:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: publish
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/unpublish:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: unpublish
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles:
    get:
      summary: Legacy paginated list with real Count and filters
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          $ref: '#/components/schemas/LegacyArticle'
                      total:
                        type: integer
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: module_code
        in: query
        schema:
          type: string
      - name: section_code
        in: query
        schema:
          type: string
      - name: subsection_code
        in: query
        schema:
          type: string
      - name: title
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: direct_only
        in: query
        schema:
          type: boolean
    post:
      summary: Legacy create; delegates to unified registration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyCreate'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    get:
      summary: Legacy article detail
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      summary: Metadata edit preserves status; archived articles require explicit
        restore
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyEdit'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/blog/modules:
