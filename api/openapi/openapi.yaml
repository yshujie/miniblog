openapi: 3.0.3
info:
  title: miniblog content API
  version: 1.1.0
  description: Content endpoints in the existing /v1 contract. Authentication and
    other management APIs are unchanged. Registration requires MINIBLOG_CONTENT_REGISTER_ENABLED
    and completed source cutover. Archived state remains legacy wire Deleted. Nullable
    source identities are not accepted from clients.
paths:
  /v1/admin/article-sources/preview:
    post:
      summary: Best-effort title preview; provider failures still return manual_required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewInput'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    $ref: '#/components/schemas/PreviewPayload'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/register:
    post:
      summary: Atomic registration or publication; duplicates preserve existing record
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    $ref: '#/components/schemas/RegisterPayload'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/reorder:
    put:
      summary: Update one complete direct-section or subsection group
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderArticles'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/catalog/reorder:
    post:
      summary: Update one complete hierarchy group
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCatalog'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/move:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: move
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Placement'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/archive:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: archive
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: restore
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/ArticleDTO'
                    required:
                    - article
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/publish:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: publish
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}/unpublish:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    put:
      summary: unpublish
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    nullable: true
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/articles:
    get:
      summary: Legacy paginated list with real Count and filters
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          $ref: '#/components/schemas/LegacyArticle'
                      total:
                        type: integer
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: module_code
        in: query
        schema:
          type: string
      - name: section_code
        in: query
        schema:
          type: string
      - name: subsection_code
        in: query
        schema:
          type: string
      - name: title
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: direct_only
        in: query
        schema:
          type: boolean
    post:
      summary: Legacy create; delegates to unified registration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyCreate'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/articles/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
        description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
    get:
      summary: Legacy article detail
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      summary: Metadata edit preserves status; archived articles require explicit
        restore
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyEdit'
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article:
                        $ref: '#/components/schemas/LegacyArticle'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/blog/modules:
    get:
      summary: Visible public modules
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      modules:
                        type: array
                        items:
                          $ref: '#/components/schemas/Module'
                required:
                - code
                - msg
                - payload
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/blog/moduleDetail:
    get:
      summary: Visible public moduleDetail
      parameters:
      - name: module_code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      module_detail:
                        $ref: '#/components/schemas/PublicModule'
                required:
                - code
                - msg
                - payload
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/blog/articleDetail:
    get:
      summary: Visible public articleDetail
      parameters:
      - name: article_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ok
                  msg:
                    type: string
                  payload:
                    type: object
                    properties:
                      article_detail:
                        $ref: '#/components/schemas/PublicArticle'
                required:
                - code
                - msg
                - payload
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PreviewInput:
      type: object
      properties:
        external_link:
          type: string
          format: uri
      required:
      - external_link
    PreviewPayload:
      type: object
      properties:
        provider:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        metadata_status:
          type: string
          enum:
          - resolved
          - manual_required
        reason:
          type: string
        existing_article:
          $ref: '#/components/schemas/ArticleDTO'
      required:
      - provider
      - canonical_url
      - title
      - metadata_status
    RegisterInput:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        section_code:
          type: string
        subsection_code:
          type: string
        publish:
          type: boolean
          default: false
      required:
      - external_link
      - title
      - section_code
    RegisterPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - created
          - already_registered
        article:
          $ref: '#/components/schemas/ArticleDTO'
      required:
      - outcome
      - article
    Placement:
      type: object
      properties:
        section_code:
          type: string
        subsection_code:
          type: string
      required:
      - section_code
    ReorderArticles:
      type: object
      properties:
        section_code:
          type: string
        subsection_code:
          type: string
        article_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]{0,18}$
            description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
          uniqueItems: true
      required:
      - section_code
      - article_ids
    ReorderCatalog:
      type: object
      properties:
        kind:
          type: string
          enum:
          - module
          - section
          - subsection
        parent_code:
          type: string
        codes:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
      - kind
      - codes
    LegacyArticle:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
          description: Legacy numeric contract; admin uses id_text.
        id_text:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        content:
          type: string
        module:
          $ref: '#/components/schemas/Module'
        section:
          $ref: '#/components/schemas/Section'
        subsection:
          $ref: '#/components/schemas/Subsection'
          nullable: true
        pos:
          type: integer
        status:
          type: string
          enum:
          - Draft
          - Published
          - Unpublished
          - Deleted
        provider:
          type: string
          nullable: true
        canonical_url:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - id_text
      - status
    ArticleDTO:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        id_text:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        content:
          type: string
        module:
          $ref: '#/components/schemas/Module'
        section:
          $ref: '#/components/schemas/Section'
        subsection:
          $ref: '#/components/schemas/Subsection'
          nullable: true
        pos:
          type: integer
        status:
          type: string
          enum:
          - Draft
          - Published
          - Unpublished
          - Deleted
        provider:
          type: string
          nullable: true
        canonical_url:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - id_text
      - status
    LegacyCreate:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        section_code:
          type: string
        subsection_code:
          type: string
        module_code:
          type: string
        content:
          type: string
      required:
      - title
      - module_code
      - section_code
      - external_link
    LegacyEdit:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        section_code:
          type: string
        subsection_code:
          type: string
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        module_code:
          type: string
        content:
          type: string
          description: Omitted preserves historical body; empty explicitly clears.
      required:
      - title
      - module_code
      - section_code
    Module:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        title:
          type: string
        sort:
          type: integer
        status:
          type: integer
    Section:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        module_code:
          type: string
        sort:
          type: integer
        status:
          type: integer
    Subsection:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        section_code:
          type: string
        sort:
          type: integer
        status:
          type: integer
    PublicArticle:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        content:
          type: string
        module_code:
          type: string
        section_code:
          type: string
        subsection_code:
          type: string
        pos:
          type: integer
        provider:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - module_code
      - section_code
    PublicModule:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        code:
          type: string
        title:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PublicSection'
    PublicSection:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        code:
          type: string
        title:
          type: string
        module_code:
          type: string
        sort:
          type: integer
        articles:
          type: array
          items:
            $ref: '#/components/schemas/PublicArticle'
        subsections:
          type: array
          items:
            $ref: '#/components/schemas/PublicSubsection'
    PublicSubsection:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        code:
          type: string
        title:
          type: string
        section_code:
