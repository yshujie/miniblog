      - name: run_id
        in: path
        required: true
        schema:
          type: string
  /v1/admin/notion-sync/runs/{run_id}/items:
    get:
      summary: Paginated preview and application results
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
