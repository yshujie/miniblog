        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - *id002
    post:
      summary: Start fresh dry_run or sync; bootstrap excluded
      security:
      - bearerAuth: []
      responses:
        '202':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
