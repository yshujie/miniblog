                required:
                - code
                - msg
                - payload
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/notion-sync/status:
    get:
      summary: Sync health and controls
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  msg:
