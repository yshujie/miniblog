            type: string
      required:
      - mode
      - managed_fields
    PublicationHold:
      type: object
      properties:
        held:
          type: boolean
        reason:
          type: string
      required:
      - held
    SyncConfig:
      type: object
      properties:
        title_property_id:
          type: string
        state_property_id:
          type: string
        topic_property_id:
          type: string
        tags_property_id:
          type: string
        description_property_id:
          type: string
        difficulty_property_id:
          type: string
        date_property_id:
          type: string
        state_option_ids:
          type: object
          additionalProperties: false
          properties:
            draft:
              type: string
            published:
              type: string
            unpublished:
              type: string
            archived:
              type: string
          required:
          - draft
          - published
          - unpublished
          - archived
    SyncTopicBinding:
      type: object
      properties:
        id:
          type: string
        source_id:
          type: string
        option_id:
          type: string
        option_name:
          type: string
        section_code:
          type: string
        status:
          type: string
        reason:
          type: string
    SyncSource:
      type: object
      properties:
        source_id:
          type: string
        label:
          type: string
        module_code:
          type: string
        health:
          type: string
        last_error:
          type: string
        enabled:
          type: boolean
        config_revision:
          type: integer
        config:
          $ref: '#/components/schemas/SyncConfig'
        catalog_bindings:
          type: array
          items:
            $ref: '#/components/schemas/SyncTopicBinding'
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_complete_scan_at:
          type: string
          format: date-time
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
    SyncPage:
      type: object
      properties:
        local_state:
          type: string
          nullable: true
          description: Current local article state; null when no article is linked.
        needs_revalidation:
          type: boolean
        effective_visibility:
          type: boolean
          description: Uses the same directory and source visibility query as public reading.
        visibility_reason:
          type: string
          description: Empty when visible; otherwise the current publication or review blocker.
        page_id:
          type: string
        source_id:
          type: string
        title:
          type: string
        desired_state:
          type: string
        status:
          type: string
        management_state:
          type: string
        publish_block_reason:
          type: string
        last_error:
          type: string
        page_url:
          type: string
        publication_hold_reason:
          type: string
        bootstrap_state:
          type: string
        article_id:
          type: string
          nullable: true
        public_url:
          type: string
          nullable: true
        publication_hold:
          type: boolean
        revision:
          type: integer
    SyncRun:
      type: object
      properties:
        run_id:
          type: string
        mode:
          type: string
        status:
          type: string
        phase:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        counts:
          type: object
          properties:
            seen:
              type: integer
            created:
              type: integer
            updated:
              type: integer
            unchanged:
              type: integer
            pending:
              type: integer
              description: Historical review or nonpublished source records awaiting action; not an execution failure.
            frozen:
              type: integer
              description: Source-disabled records preserved without applying changes.
            blocked:
              type: integer
            failed:
              type: integer
        error:
          type: string
    SyncItem:
      type: object
      properties:
        item_id:
          type: string
        page_id:
          type: string
        article_id:
          type: string
          nullable: true
        outcome:
          type: string
        reason:
          type: string
        before: {}
        after: {}
        error:
          type: string
    SyncStatus:
      type: object
      properties:
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
        paused:
          type: boolean
        source_writes_paused:
          type: boolean
        baseline_frozen:
          type: boolean
        current_run_id:
          type: string
          nullable: true
        health:
          type: string
        pending_count:
          type: integer
          description: Historical pages awaiting explicit takeover review.
        blocked_count:
          type: integer
          description: Managed publication candidates restricted by public conditions, holds, or revalidation; excludes historical pending and ordinary drafts.
        error_count:
          type: integer
          description: Page read or execution failures, separate from publication restrictions.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SyncSource'
        last_complete_scan_at:
          type: string
          format: date-time
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
    SyncControlInput:
      type: object
      properties:
        enabled:
          type: boolean
          description: Runtime switch; requests may echo the current value but cannot change it. Use paused.
        paused:
          type: boolean
        source_writes_paused:
          type: boolean
      additionalProperties: false
    SyncSourceInput:
      type: object
      properties:
        label:
          type: string
        module_code:
          type: string
        enabled:
          type: boolean
        config:
          description: Send only actual mapping changes. Repeating identical configuration preserves the revision and visibility.
          $ref: '#/components/schemas/SyncConfig'
        expected_config_revision:
          type: integer
          minimum: 0
      additionalProperties: false
    SyncBindingInput:
      type: object
      properties:
        source_id:
          type: string
        option_id:
          type: string
        section_code:
          type: string
        expected_config_revision:
          type: integer
          minimum: 0
      required:
      - source_id
      - option_id
      - section_code
      - expected_config_revision
      additionalProperties: false
    SyncRunInput:
      type: object
      properties:
        mode:
          type: string
          enum:
          - dry_run
          - sync
      required:
      - mode
      additionalProperties: false
    LocalFieldsInput:
      type: object
      properties:
        author:
          type: string
          maxLength: 128
      required:
      - author
      additionalProperties: false
    PublicationHoldInput:
      type: object
      properties:
        held:
          type: boolean
        reason:
          type: string
          maxLength: 255
      required:
      - held
      additionalProperties: false
    SyncSourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncSource'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
      - items
      - total
      - page
      - limit
    SyncPageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncPage'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
      - items
      - total
      - page
      - limit
    SyncRunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
      - items
      - total
      - page
      - limit
    SyncItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
      - items
      - total
      - page
      - limit
  responses:
    Error:
      description: Business or database failure; never an empty-directory substitute
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
