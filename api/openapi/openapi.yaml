      - &id001
        name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 1000000
      - &id002
        name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
  /v1/admin/notion-sync/pages:
