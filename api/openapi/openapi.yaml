        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - *id001
      - *id002
  /v1/admin/notion-sync/control:
    patch:
      summary: Pause and fence current work; runtime enabled is immutable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code/msg/payload envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  msg:
                    type: string
                  payload:
                    $ref: '#/components/schemas/SyncStatus'
                required:
                - code
                - msg
                - payload
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
