          items:
            type: string
        publication_hold:
          $ref: '#/components/schemas/PublicationHold'
        effective_visibility:
          type: boolean
        reading_url:
          type: string
      required:
      - id
      - id_text
      - status
    ArticleDTO:
      type: object
