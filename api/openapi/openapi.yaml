          type: array
          items:
            type: string
          uniqueItems: true
      required:
      - kind
      - codes
    LegacyArticle:
      type: object
      properties:
        title:
          type: string
        external_link:
          type: string
          format: uri
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
          description: Legacy numeric contract; admin uses id_text.
        id_text:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        content:
          type: string
        module:
          $ref: '#/components/schemas/Module'
        section:
          $ref: '#/components/schemas/Section'
        subsection:
          $ref: '#/components/schemas/Subsection'
          nullable: true
        pos:
          type: integer
        status:
          type: string
          enum:
