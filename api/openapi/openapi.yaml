        author:
          type: string
        tags:
          type: array
          items:
            type: string
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        id_text:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Decimal signed BIGINT, 1..9223372036854775807. Keep as string.
        content:
          type: string
        module:
