name: DB Operations (manual)

on:
  workflow_dispatch:
    inputs:
      skip_db_init:
        description: Skip database initialization
        type: boolean
        default: true
      skip_db_migrate:
        description: Skip database migration
        type: boolean
        default: true
      skip_db_seed:
        description: Skip database seed data
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: miniblog-db-operations
  cancel-in-progress: false

env:
  DB_OPS_DIR: /tmp/miniblog-db-ops-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  db-ops:
    runs-on: ubuntu-latest
    steps:
      - name: No database operation selected
        if: ${{ inputs.skip_db_init && inputs.skip_db_migrate && inputs.skip_db_seed }}
        run: echo "All database operations were skipped; no remote command was executed."

      - name: Check out current revision
        if: ${{ !inputs.skip_db_init || !inputs.skip_db_migrate || !inputs.skip_db_seed }}
        uses: actions/checkout@v4

      - name: Upload database operation files to ServerD
        if: ${{ !inputs.skip_db_init || !inputs.skip_db_migrate || !inputs.skip_db_seed }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key: ${{ secrets.SVRD_SSH_KEY }}
          port: ${{ secrets.SVRD_SSH_PORT || 22 }}
          source: Makefile,scripts/db-init.sh,scripts/db-migrate.sh,scripts/load-seed-data.sh,db/migrations
          target: ${{ env.DB_OPS_DIR }}

      - name: Initialize database on ServerD
        if: ${{ !inputs.skip_db_init }}
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key: ${{ secrets.SVRD_SSH_KEY }}
          port: ${{ secrets.SVRD_SSH_PORT || 22 }}
          envs: DB_ROOT_PASSWORD
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "${{ env.DB_OPS_DIR }}"
            test -f /opt/miniblog/.env

            export PIPELINE_ENV_FILE=/opt/miniblog/.env
            export ENABLE_DB_INIT=true
            ./scripts/db-init.sh

      - name: Migrate database on ServerD
        if: ${{ !inputs.skip_db_migrate }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key: ${{ secrets.SVRD_SSH_KEY }}
          port: ${{ secrets.SVRD_SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "${{ env.DB_OPS_DIR }}"
            test -f /opt/miniblog/.env

            export PIPELINE_ENV_FILE=/opt/miniblog/.env
            export DOCKER_NETWORK=infra-network
            ./scripts/db-migrate.sh

      - name: Load seed data on ServerD
        if: ${{ !inputs.skip_db_seed }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key: ${{ secrets.SVRD_SSH_KEY }}
          port: ${{ secrets.SVRD_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            cd "${{ env.DB_OPS_DIR }}"
            test -f /opt/miniblog/.env

            export PIPELINE_ENV_FILE=/opt/miniblog/.env
            export ENABLE_DB_SEED=true
            ./scripts/load-seed-data.sh

      - name: Remove database operation files from ServerD
        if: ${{ always() && (!inputs.skip_db_init || !inputs.skip_db_migrate || !inputs.skip_db_seed) }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key: ${{ secrets.SVRD_SSH_KEY }}
          port: ${{ secrets.SVRD_SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            set -Eeuo pipefail
            rm -rf -- "${{ env.DB_OPS_DIR }}"
