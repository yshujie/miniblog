name: Notion reviewed maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reviewed operation; no automatic bootstrap retry
        type: choice
        options:
          - pause
          - resume
          - catalog_prepare
          - catalog_bind
          - catalog_activate
          - source_update
          - bootstrap_preview
          - bootstrap_apply
          - sync
          - scheduler_on
          - scheduler_off
        required: true
      manifest_id:
        description: Private server review file ID (no path)
        type: string
        required: true
      manifest_sha256:
        description: SHA256 of the reviewed private file bytes
        type: string
        required: true
      expected_image_sha:
        description: Full 40-character SHA of the current backend image tag
        type: string
        required: true
      expected_config_revision:
        description: Exact reviewed source revision; 0 for global pause/resume/off
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: miniblog-prod
  cancel-in-progress: false

jobs:
  maintenance:
    if: ${{ github.ref == 'refs/heads/main' && inputs.action != 'bootstrap_apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate maintenance scripts with local fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/notion-ops -p 'test_*.py'
      - name: Run reviewed maintenance
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USER: ${{ secrets.SVRB_USERNAME || secrets.SVRB_USER }}
          SVRB_PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
          MINIBLOG_NOTION_TOKEN: ${{ contains(fromJSON('["catalog_prepare","bootstrap_preview","sync","scheduler_on"]'), inputs.action) && secrets.MINIBLOG_NOTION_TOKEN || '' }}
          NOTION_ROLLOUT_ACTION: ${{ inputs.action }}
          NOTION_MANIFEST_ID: ${{ inputs.manifest_id }}
          NOTION_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          NOTION_EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          NOTION_EXPECTED_CONFIG_REVISION: ${{ inputs.expected_config_revision }}
        run: python3 scripts/notion-ops/transport.py --mode rollout
      - name: Remove only this run's private staging and owned task containers
        if: ${{ always() }}
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USER: ${{ secrets.SVRB_USERNAME || secrets.SVRB_USER }}
          SVRB_PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
        run: python3 scripts/notion-ops/transport.py --mode cleanup_rollout

  # The writer secret appears only in this job and only in the apply step.
  bootstrap-apply:
    if: ${{ github.ref == 'refs/heads/main' && inputs.action == 'bootstrap_apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate maintenance scripts with local fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/notion-ops -p 'test_*.py'
      - name: Apply explicitly reviewed per-page bootstrap confirmations
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USER: ${{ secrets.SVRB_USERNAME || secrets.SVRB_USER }}
          SVRB_PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
          MINIBLOG_NOTION_TOKEN: ${{ secrets.MINIBLOG_NOTION_TOKEN }}
          MINIBLOG_NOTION_BOOTSTRAP_TOKEN: ${{ secrets.MINIBLOG_NOTION_BOOTSTRAP_TOKEN }}
          NOTION_ROLLOUT_ACTION: ${{ inputs.action }}
          NOTION_MANIFEST_ID: ${{ inputs.manifest_id }}
          NOTION_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          NOTION_EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          NOTION_EXPECTED_CONFIG_REVISION: ${{ inputs.expected_config_revision }}
        run: python3 scripts/notion-ops/transport.py --mode rollout
      - name: Remove only this run's temporary writer and owned task containers
        if: ${{ always() }}
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USER: ${{ secrets.SVRB_USERNAME || secrets.SVRB_USER }}
          SVRB_PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
        run: python3 scripts/notion-ops/transport.py --mode cleanup_rollout
