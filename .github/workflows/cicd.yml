name: CI/CD (miniblog - production, linux runner)

# ============================================================================
# GitHub Secrets 配置指引
# ----------------------------------------------------------------------------
# 必需（main push / workflow_dispatch 才强制）：
#   SVRD_HOST, SVRD_USERNAME, SVRD_SSH_KEY, SVRD_SSH_PORT (可选，默认 22)
#   MYSQL_HOST, MYSQL_DBNAME, MYSQL_USERNAME, MYSQL_PASSWORD, MYSQL_PORT (可选)
#   REDIS_HOST, REDIS_PASSWORD, REDIS_PORT (可选), REDIS_DB (可选)
#   JWT_SECRET
#
# 可选：
#   SVRD_SUDO_PASSWORD（serverD 部署用户执行 sudo 需要密码时必须）
#   FEISHU_DOCREADER_APPID, FEISHU_DOCREADER_APPSECRET
#
# 说明：
# - PR 只做 lint/test，不用这些 Secrets。
# - main push / workflow_dispatch 缺必需项会直接失败。
# - 部署只针对 ServerD（应用机）；若 nginx 在 ServerA，可配置 SVRA_* 以在部署后自动重载 nginx。
# 可选（ServerA nginx 重载）：SVRA_HOST, SVRA_USER, SVRA_SSH_KEY, SVRA_SSH_PORT（默认 22）
# ============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: miniblog-prod
  cancel-in-progress: false

env:
  GO_VERSION: "1.24"
  TAG: ${{ github.sha }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/miniblog-backend
  FE_BLOG_IMAGE: ghcr.io/${{ github.repository_owner }}/miniblog-frontend-blog
  FE_ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/miniblog-frontend-admin

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check Required Secrets
        env:
          SVRD_HOST:           ${{ secrets.SVRD_HOST }}
          SVRD_USERNAME:       ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          SVRD_SSH_KEY:        ${{ secrets.SVRD_SSH_KEY }}
          SVRD_SSH_PORT:       ${{ secrets.SVRD_SSH_PORT }}
          SVRD_SUDO_PASSWORD:  ${{ secrets.SVRD_SUDO_PASSWORD }}
          MYSQL_HOST:          ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT:          ${{ secrets.MYSQL_PORT }}
          MYSQL_DBNAME:        ${{ secrets.MYSQL_DBNAME }}
          MYSQL_USERNAME:      ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
          REDIS_HOST:          ${{ secrets.REDIS_HOST }}
          REDIS_PORT:          ${{ secrets.REDIS_PORT }}
          REDIS_DB:            ${{ secrets.REDIS_DB }}
          REDIS_PASSWORD:      ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET:          ${{ secrets.JWT_SECRET }}
          FEISHU_APPID:        ${{ secrets.FEISHU_DOCREADER_APPID }}
          FEISHU_SECRET:       ${{ secrets.FEISHU_DOCREADER_APPSECRET }}
        run: |
          echo "🔍 Validating required secrets (non-blocking)..."
          REQUIRED_APP=(SVRD_HOST SVRD_USERNAME SVRD_SSH_KEY MYSQL_HOST MYSQL_DBNAME MYSQL_USERNAME MYSQL_PASSWORD REDIS_HOST REDIS_PASSWORD JWT_SECRET)
          OPTIONAL_APP=(SVRD_SSH_PORT SVRD_SUDO_PASSWORD MYSQL_PORT REDIS_PORT REDIS_DB FEISHU_APPID FEISHU_SECRET)
          FAILED=0
          ENFORCE=0

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENFORCE=1
            echo "📋 Enforcing required secrets for main push."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENFORCE=1
            echo "📋 Enforcing required secrets for workflow_dispatch."
          else
            echo "ℹ️ PR/other branches: reporting missing secrets as warnings."
          fi

          for k in "${REQUIRED_APP[@]}"; do
            v="${!k}"
            if [ -z "$v" ]; then
              if [ $ENFORCE -eq 1 ]; then
                echo "❌ $k is not set"
                FAILED=1
              else
                echo "⚠️ $k is not set (required on deploy)"
              fi
            else
              echo "✅ $k is set"
            fi
          done

          for k in "${OPTIONAL_APP[@]}"; do
            v="${!k}"
            if [ -z "$v" ]; then
              echo "⚠️ $k not set (optional)"
            else
              echo "✅ $k is set"
            fi
          done

          echo
          if [ $FAILED -eq 1 ]; then
            if [ $ENFORCE -eq 1 ]; then
              echo "❌ Secrets validation failed. Stop pipeline."
              exit 1
            fi
            echo "⚠️ Secrets validation failed, but continuing (non-blocking for PRs)."
          else
            echo "✅ Secrets validation passed."
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download deps
        run: |
          go mod download
          go mod verify
      - name: Run unit tests
        run: |
          go test -v ./...

  lint:
    name: Lint (go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run go vet
        run: |
          go vet ./...

  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: [validate-secrets, lint, test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            file: build/docker/miniblog/Dockerfile.prod.backend
            build_args: |
              GOPROXY=https://goproxy.cn,direct
          - name: frontend-blog
            context: .
            file: build/docker/miniblog/Dockerfile.prod.frontend.blog
          - name: frontend-admin
            context: .
            file: build/docker/miniblog/Dockerfile.prod.frontend.admin
    steps:
      - uses: actions/checkout@v4

      - name: Pre-clean GHCR auth
        run: |
          docker logout ghcr.io || true
          rm -f ~/.docker/config.json || true

      - name: Login to GHCR with GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || matrix.name == 'frontend-blog' && env.FE_BLOG_IMAGE || env.FE_ADMIN_IMAGE }}:${{ env.TAG }}
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || matrix.name == 'frontend-blog' && env.FE_BLOG_IMAGE || env.FE_ADMIN_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app:
    name: Deploy to ServerD (app)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      SVRA_HOST: ${{ secrets.SVRA_HOST }}
      SVRA_USER: ${{ secrets.SVRA_USER }}
      SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
      SVRA_SSH_PORT: ${{ secrets.SVRA_SSH_PORT || 22 }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key:      ${{ secrets.SVRD_SSH_KEY }}
          port:     ${{ secrets.SVRD_SSH_PORT || 22 }}
          source:   "docker-compose.yml,docker-compose.prod.yml"
          target:   "/tmp/miniblog-deploy"

      - name: Deploy on ServerD (docker compose)
        uses: appleboy/ssh-action@v1.0.0
        env:
          _IMG_BACKEND:     ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          _IMG_FE_BLOG:     ${{ env.FE_BLOG_IMAGE }}:${{ env.TAG }}
          _IMG_FE_ADMIN:    ${{ env.FE_ADMIN_IMAGE }}:${{ env.TAG }}
          _GH_USER:         ${{ github.repository_owner }}
          _GHCR_USERNAME:   ${{ github.actor }}
          _GHCR_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          SUDO_PASSWORD:    ${{ secrets.SVRD_SUDO_PASSWORD }}
          _MYSQL_HOST:      ${{ secrets.MYSQL_HOST }}
          _MYSQL_PORT:      ${{ secrets.MYSQL_PORT }}
          _MYSQL_DBNAME:    ${{ secrets.MYSQL_DBNAME }}
          _MYSQL_USERNAME:  ${{ secrets.MYSQL_USERNAME }}
          _MYSQL_PASSWORD:  ${{ secrets.MYSQL_PASSWORD }}
          _REDIS_HOST:      ${{ secrets.REDIS_HOST }}
          _REDIS_PORT:      ${{ secrets.REDIS_PORT }}
          _REDIS_DB:        ${{ secrets.REDIS_DB }}
          _REDIS_PASSWORD:  ${{ secrets.REDIS_PASSWORD }}
          _JWT_SECRET:      ${{ secrets.JWT_SECRET }}
          _FEISHU_APPID:    ${{ secrets.FEISHU_DOCREADER_APPID }}
          _FEISHU_SECRET:   ${{ secrets.FEISHU_DOCREADER_APPSECRET }}
        with:
          host:     ${{ secrets.SVRD_HOST }}
          username: ${{ secrets.SVRD_USERNAME || secrets.SVRD_USER }}
          key:      ${{ secrets.SVRD_SSH_KEY }}
          port:     ${{ secrets.SVRD_SSH_PORT || 22 }}
          # 关键：将上面 env 中的变量名传递给远端
          envs: >
            _IMG_BACKEND,_IMG_FE_BLOG,_IMG_FE_ADMIN,
            _GH_USER,_GHCR_USERNAME,_GHCR_TOKEN,
            SUDO_PASSWORD,
            _MYSQL_HOST,_MYSQL_PORT,_MYSQL_DBNAME,_MYSQL_USERNAME,_MYSQL_PASSWORD,
            _REDIS_HOST,_REDIS_PORT,_REDIS_DB,_REDIS_PASSWORD,
            _JWT_SECRET,_FEISHU_APPID,_FEISHU_SECRET
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/miniblog"
            STAGE_DIR="/tmp/miniblog-deploy"

            if sudo -n true 2>/dev/null; then
              SUDO="sudo"
              echo "ℹ️ Using passwordless sudo."
            else
              if [ -z "${SUDO_PASSWORD:-}" ]; then
                echo "❌ sudo needs password. Provide SVRD_SUDO_PASSWORD or configure NOPASSWD." >&2
                exit 1
              fi
              sudo_pw() { sudo -S "$@" <<<"$SUDO_PASSWORD"; }
              export -f sudo_pw
              SUDO="sudo_pw"
              if ! $SUDO -v; then
                echo "❌ sudo authentication failed. Check GitHub Secret SVRD_SUDO_PASSWORD for the ServerD deploy user." >&2
                exit 1
              fi
              echo "ℹ️ Using sudo with password."
            fi

            if [ "$SUDO" = "sudo_pw" ]; then
              SUDO_ASKPASS_SCRIPT="$(mktemp)"
              printf '%s\n' '#!/bin/sh' 'printf '\''%s\n'\'' "$SUDO_PASSWORD"' >"$SUDO_ASKPASS_SCRIPT"
              chmod 700 "$SUDO_ASKPASS_SCRIPT"
            fi

            cleanup_auth_helpers() {
              if [ -n "${SUDO_ASKPASS_SCRIPT:-}" ]; then
                rm -f "$SUDO_ASKPASS_SCRIPT"
              fi
            }
            trap cleanup_auth_helpers EXIT

            docker_login_with_token() {
              local username="$1"
              local token="$2"
              local registry="${3:-}"
              local token_file rc
              token_file="$(mktemp)"
              chmod 600 "$token_file"
              printf '%s' "$token" >"$token_file"
              rc=1
              if [ "$SUDO" = "sudo_pw" ]; then
                if [ -n "$registry" ]; then
                  if SUDO_ASKPASS="$SUDO_ASKPASS_SCRIPT" sudo -A docker login "$registry" -u "$username" --password-stdin <"$token_file" >/dev/null; then
                    rc=0
                  else
                    rc=$?
                  fi
                else
                  if SUDO_ASKPASS="$SUDO_ASKPASS_SCRIPT" sudo -A docker login -u "$username" --password-stdin <"$token_file" >/dev/null; then
                    rc=0
                  else
                    rc=$?
                  fi
                fi
              else
                if [ -n "$registry" ]; then
                  if $SUDO docker login "$registry" -u "$username" --password-stdin <"$token_file" >/dev/null; then
                    rc=0
                  else
                    rc=$?
                  fi
                else
                  if $SUDO docker login -u "$username" --password-stdin <"$token_file" >/dev/null; then
                    rc=0
                  else
                    rc=$?
                  fi
                fi
              fi
              rm -f "$token_file"
              return "$rc"
            }

            if [ ! -f "${STAGE_DIR}/docker-compose.yml" ] || [ ! -f "${STAGE_DIR}/docker-compose.prod.yml" ]; then
              echo "❌ Missing uploaded compose files in ${STAGE_DIR}"
              exit 1
            fi

            $SUDO mkdir -p "${APP_DIR}"
            $SUDO cp "${STAGE_DIR}/docker-compose.yml" "${STAGE_DIR}/docker-compose.prod.yml" "${APP_DIR}/"
            $SUDO chown -R "$(id -u):$(id -g)" "${APP_DIR}"
            rm -rf "${STAGE_DIR}"

            cd "${APP_DIR}"

            cat > .env <<EOF
            BACKEND_IMAGE_TAG=${_IMG_BACKEND}
            FRONTEND_BLOG_IMAGE_TAG=${_IMG_FE_BLOG}
            FRONTEND_ADMIN_IMAGE_TAG=${_IMG_FE_ADMIN}

            GIN_MODE=release

            MYSQL_HOST=${_MYSQL_HOST}
            MYSQL_PORT=${_MYSQL_PORT}
            MYSQL_DATABASE=${_MYSQL_DBNAME}
            MYSQL_USERNAME=${_MYSQL_USERNAME}
            MYSQL_PASSWORD=${_MYSQL_PASSWORD}

            REDIS_HOST=${_REDIS_HOST}
            REDIS_PORT=${_REDIS_PORT}
            REDIS_DB=${_REDIS_DB}
            REDIS_PASSWORD=${_REDIS_PASSWORD}

            JWT_SECRET=${_JWT_SECRET}

            FEISHU_DOCREADER_APPID=${_FEISHU_APPID}
            FEISHU_DOCREADER_APPSECRET=${_FEISHU_SECRET}
            EOF
            $SUDO chmod 600 .env

            # 创建业务网络（miniblog），infra-network 由基础设施预创建
            $SUDO docker network inspect miniblog-network >/dev/null 2>&1 || $SUDO docker network create miniblog-network
            if ! $SUDO docker network inspect infra-network >/dev/null 2>&1; then
              echo "⚠️ infra-network 不存在，请先在基础设施侧创建（overlay/attachable）"
              exit 1
            fi
            $SUDO mkdir -p /data/logs/miniblog/backend /data/logs/miniblog/frontend-blog /data/logs/miniblog/frontend-admin

            # 使用 GITHUB_TOKEN 登录 GHCR（仓库内私有镜像可拉取）
            if [ -n "${_GHCR_TOKEN}" ]; then
              DOCKER_USER="${_GHCR_USERNAME:-${_GH_USER}}"
              docker_login_with_token "${DOCKER_USER}" "${_GHCR_TOKEN}" ghcr.io
            fi

            $SUDO docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            $SUDO docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # 等待后端就绪（便于 ServerA 上 nginx 重载后能连到 ServerD 新实例）
            echo "Waiting for backend health (up to 60s)..."
            for i in $(seq 1 30); do
              if $SUDO docker exec miniblog-backend wget --spider -q http://localhost:8080/health 2>/dev/null; then
                echo "Backend healthy after $((i*2))s"
                break
              fi
              sleep 2
            done

            $SUDO docker compose ps

      - name: Reload nginx on ServerA
        if: env.SVRA_HOST != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ env.SVRA_HOST }}
          username: ${{ env.SVRA_USER }}
          key:      ${{ env.SVRA_SSH_KEY }}
          port:     ${{ env.SVRA_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # 重载 nginx，使 upstream 指向 ServerD 的新实例（避免 keepalive 连到旧连接）
            # ServerA 上 nginx 在 Docker 中，SSH 用户通常需 sudo 才能执行 docker
            if command -v docker >/dev/null 2>&1; then
              if sudo docker exec nginx nginx -t 2>/dev/null; then
                sudo docker exec nginx nginx -s reload
                echo "Nginx reloaded on ServerA (Docker)."
                exit 0
              fi
              if docker exec nginx nginx -t 2>/dev/null; then
                docker exec nginx nginx -s reload
                echo "Nginx reloaded on ServerA (Docker, no sudo)."
                exit 0
              fi
            fi
            if sudo systemctl is-active -q nginx 2>/dev/null && sudo nginx -t 2>/dev/null; then
              sudo systemctl reload nginx
              echo "Nginx reloaded on ServerA (systemd)."
              exit 0
            fi
            echo "⚠️ Nginx not found: docker exec nginx 或 systemctl nginx 均失败，请检查容器名与 sudo 权限。"
            exit 1

  notify:
    name: Send Notification
    needs: [deploy-app]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Log deployment status
        run: |
          APP_STATUS="${{ needs.deploy-app.result }}"

          echo "App deploy: $APP_STATUS"

          if [ "$APP_STATUS" = "success" ]; then
            echo "✅ Deployment to production succeeded"
          elif [ "$APP_STATUS" = "skipped" ]; then
            echo "ℹ️ App deployment skipped (non-main push)"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
