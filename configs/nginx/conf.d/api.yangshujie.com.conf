# api.yangshujie.com —— 后端 API（含 CORS 白名单）
# 注意：本文件被包含于 http{} 内

# 后端 upstream
upstream miniblog-api {
    server miniblog-backend:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.yangshujie.com;

    # TLS（使用通配符证书）
    ssl_certificate     /data/ssl/certs/yangshujie.com.crt;
    ssl_certificate_key /data/ssl/private/yangshujie.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    # CORS 白名单。仅白名单来源才会拿到可用的 CORS 响应头。
    set $cors_origin "";
    set $cors_credentials "";
    set $cors_methods "";
    set $cors_headers "";
    set $cors_max_age "";

    if ($http_origin ~* "^https://(www|admin)\.yangshujie\.com$") {
        set $cors_origin $http_origin;
        set $cors_credentials "true";
        set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        set $cors_headers "Content-Type, Authorization, X-Requested-With";
        set $cors_max_age "3600";
    }

    # 安全响应头（API 不允许被内嵌）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods $cors_methods always;
    add_header Access-Control-Allow-Headers $cors_headers always;
    add_header Access-Control-Allow-Credentials $cors_credentials always;
    add_header Access-Control-Max-Age $cors_max_age always;

    # 健康检查
    location = /health {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_pass http://miniblog-api/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 预检请求直接由 Nginx 返回，避免打到后端。
        if ($request_method = OPTIONS) {
            return 204;
        }

        # 隐藏上游同名响应头，避免 Nginx 与后端重复/冲突。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_pass http://miniblog-api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 80 → 443 重定向 + ACME 校验
server {
    listen 80;
    server_name api.yangshujie.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
